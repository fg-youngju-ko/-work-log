<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무일지</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --note-bg: #fffdf4;
    --note-border: #f0e6b8;
    --text: #1f2328;
    --text-muted: #6b7280;
    --accent: #f5b400;
    --accent-dark: #d99a00;
    --danger: #ef4444;
    --border: #e5e7eb;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --card-bg: #1f2126;
      --note-bg: #262820;
      --note-border: #3a3626;
      --text: #e8e9ec;
      --text-muted: #9a9ea5;
      --accent: #f5b400;
      --accent-dark: #ffcc33;
      --danger: #f87171;
      --border: #2e3036;
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181c; --card-bg: #1f2126; --note-bg: #262820; --note-border: #3a3626;
    --text: #e8e9ec; --text-muted: #9a9ea5; --accent: #f5b400; --accent-dark: #ffcc33;
    --danger: #f87171; --border: #2e3036; --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7; --card-bg: #ffffff; --note-bg: #fffdf4; --note-border: #f0e6b8;
    --text: #1f2328; --text-muted: #6b7280; --accent: #f5b400; --accent-dark: #d99a00;
    --danger: #ef4444; --border: #e5e7eb; --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px 20px 80px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    align-items: start;
  }
  .left-col, .right-col { min-width: 0; }
  .app-header { grid-column: 1 / -1; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; max-width: 720px; }
    .app-header { grid-column: 1; }
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 22px;
    margin: 0;
  }
  header .count {
    color: var(--text-muted);
    font-size: 13px;
  }
  .form-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 28px;
  }
  textarea#contentInput {
    width: 100%;
    min-height: 90px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 14.5px;
    font-family: inherit;
    background: transparent;
    color: var(--text);
    line-height: 1.5;
  }
  textarea#contentInput:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .datetime-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .datetime-row label { display: flex; align-items: center; gap: 6px; }
  .datetime-row input[type="datetime-local"] {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 8px;
    font-family: inherit;
    font-size: 13px;
    background: var(--card-bg);
    color: var(--text);
  }
  .hidden { display: none !important; }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 14px;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    border: none;
    border-radius: 9px;
    padding: 9px 18px;
    cursor: pointer;
    font-weight: 600;
    transition: opacity .15s;
  }
  button:hover { opacity: 0.85; }
  #saveBtn { background: var(--accent); color: #1f2328; }
  #cancelEditBtn { background: var(--border); color: var(--text); }
  .entry-list { display: flex; flex-direction: column; gap: 14px; }
  .entry-card {
    background: var(--note-bg);
    border: 1px solid var(--note-border);
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
    position: relative;
  }
  .entry-meta {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .entry-meta .stamp { font-weight: 600; color: var(--accent-dark); }
  .entry-content {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14.5px;
    line-height: 1.55;
  }
  .entry-actions {
    display: flex;
    gap: 6px;
  }
  .icon-btn {
    background: transparent;
    color: var(--text-muted);
    padding: 3px 6px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
  }
  .icon-btn:hover { background: var(--border); opacity: 1; }
  .icon-btn.danger { color: var(--danger); }
  .icon-btn.confirming { background: var(--danger); color: #fff; }
  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 0;
    font-size: 14px;
  }
  .todo-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 28px;
  }
  .todo-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .todo-header h2 {
    font-size: 15px;
    margin: 0;
  }
  #pipBtn {
    background: var(--border);
    color: var(--text);
    font-size: 12.5px;
    padding: 6px 12px;
  }
  .todo-hint {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 6px;
  }
  .todo-input-row {
    display: flex;
    gap: 8px;
  }
  #todoInput {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 14px;
    background: transparent;
    color: var(--text);
  }
  #todoInput:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #todoCategoryInput {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 6px;
    font-family: inherit;
    font-size: 13px;
    background: var(--card-bg);
    color: var(--text);
  }
  #todoAddBtn { background: var(--accent); color: #1f2328; padding: 8px 16px; }
  .todo-list {
    list-style: none;
    margin: 12px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .todo-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 8px;
    border-radius: 8px;
  }
  .todo-item:hover { background: var(--bg); }
  .todo-item input[type="checkbox"] {
    margin-top: 3px;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    accent-color: var(--accent);
  }
  .todo-item .todo-body { flex: 1; min-width: 0; }
  .todo-text-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .todo-item .todo-text {
    font-size: 14px;
    word-break: break-word;
  }
  .memo-trigger {
    position: relative;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 1px 7px;
    border-radius: 6px;
    border: 1px dashed var(--border);
    white-space: nowrap;
  }
  .memo-trigger:hover { background: var(--bg); }
  .memo-popup {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 6px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 10px 12px;
    width: max-content;
    max-width: 260px;
    white-space: pre-wrap;
    font-size: 12.5px;
    color: var(--text);
    z-index: 20;
    cursor: default;
  }
  .memo-trigger:hover .memo-popup { display: block; }
  .memo-edit { margin-top: 8px; }
  .memo-edit textarea {
    width: 100%;
    min-height: 60px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    font-family: inherit;
    font-size: 13px;
    background: transparent;
    color: var(--text);
    resize: vertical;
  }
  .memo-edit-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 6px;
  }
  .memo-category-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .memo-category-label select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 6px;
    font-family: inherit;
    font-size: 12px;
    background: var(--card-bg);
    color: var(--text);
  }
  .memo-edit-actions .memo-edit-buttons { display: flex; gap: 6px; }
  .memo-edit-actions button { padding: 5px 12px; font-size: 12px; }
  .memo-save-btn { background: var(--accent); color: #1f2328; }
  .memo-cancel-btn { background: var(--border); color: var(--text); }
  .todo-item .todo-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .todo-item .delete-btn {
    flex-shrink: 0;
  }
  .todo-empty {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    padding: 16px 0;
  }
  .todo-placeholder {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }
  .category-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .category-row label { display: flex; align-items: center; gap: 6px; }
  #categoryInput {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 8px;
    font-family: inherit;
    font-size: 13px;
    background: var(--card-bg);
    color: var(--text);
  }
  .category-manage-btn {
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    padding: 4px 2px;
    text-decoration: underline;
  }
  .category-panel {
    margin-top: 10px;
    padding: 12px;
    border: 1px dashed var(--border);
    border-radius: 10px;
  }
  .category-chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .category-chip-wrap { position: relative; display: inline-flex; }
  .category-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 6px 4px 12px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .category-chip button {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 2px 6px;
    font-size: 13px;
    font-weight: 700;
  }
  .color-swatch-panel {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 6px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 10px;
    width: 172px;
    z-index: 30;
  }
  .color-swatch-panel.open { display: block; }
  .color-swatch-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }
  .color-swatch {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    padding: 0;
  }
  .color-swatch.selected { border-color: var(--text); }
  .color-swatch-auto-btn {
    width: 100%;
    font-size: 11.5px;
    padding: 5px;
    background: var(--border);
    color: var(--text);
  }
  .category-add-row { display: flex; gap: 6px; }
  .category-add-row input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 13px;
    background: transparent;
    color: var(--text);
  }
  .category-add-row button { padding: 6px 14px; font-size: 12.5px; background: var(--accent); color: #1f2328; }
  .meta-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .category-tag {
    background: var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid transparent;
  }
  .category-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    background: var(--border);
  }
  .summary-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 28px;
  }
  .summary-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    gap: 8px;
  }
  .summary-header h2 { font-size: 15px; margin: 0; }
  .summary-range { font-size: 12px; color: var(--text-muted); }
  .summary-group { margin-bottom: 14px; }
  .summary-group:last-child { margin-bottom: 0; }
  .summary-group-title {
    font-size: 13.5px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .summary-group-title .count { font-weight: 500; color: var(--text-muted); font-size: 12px; }
  .summary-item {
    font-size: 13px;
    color: var(--text);
    padding: 4px 0 4px 10px;
    border-left: 2px solid var(--border);
    margin-bottom: 4px;
  }
  .summary-item .summary-time { color: var(--text-muted); font-size: 11.5px; margin-right: 6px; }
  .summary-empty {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    padding: 16px 0;
  }
  .search-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .search-row input[type="text"] {
    flex: 1;
    min-width: 140px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13.5px;
    background: var(--card-bg);
    color: var(--text);
  }
  .search-row input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .search-row input[type="date"],
  .search-row select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 8px;
    font-family: inherit;
    font-size: 13px;
    background: var(--card-bg);
    color: var(--text);
  }
  .search-row button {
    background: var(--border);
    color: var(--text);
    font-size: 12.5px;
    padding: 7px 14px;
  }
  .io-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
  }
  .io-row button {
    background: var(--border);
    color: var(--text);
    font-size: 12.5px;
    padding: 6px 12px;
  }
  .io-status {
    font-size: 12px;
    color: var(--text-muted);
  }
  .daily-card, .calendar-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 28px;
  }
  .daily-header, .calendar-header {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
  }
  .daily-header h2 { font-size: 15px; margin: 0; }
  .daily-input-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }
  .daily-input-row input[type="text"] {
    flex: 1;
    min-width: 140px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 14px;
    background: transparent;
    color: var(--text);
  }
  .daily-input-row select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 6px;
    font-family: inherit;
    font-size: 13px;
    background: var(--card-bg);
    color: var(--text);
  }
  #dailyAddBtn { background: var(--accent); color: #1f2328; padding: 8px 16px; }
  .calendar-header {
    justify-content: space-between;
  }
  .calendar-header button {
    background: var(--border);
    color: var(--text);
    padding: 4px 12px;
    font-size: 14px;
  }
  .calendar-header span { font-size: 14px; font-weight: 600; }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 14px;
  }
  .calendar-weekday {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    padding-bottom: 4px;
  }
  .calendar-day {
    position: relative;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--text);
    cursor: default;
  }
  .calendar-day.empty { visibility: hidden; }
  .calendar-day.today {
    background: var(--accent);
    color: #1f2328;
    font-weight: 700;
  }
  .calendar-day.has-events:not(.today) { background: var(--bg); font-weight: 600; }
  .calendar-day .day-dot {
    position: absolute;
    bottom: 3px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent-dark);
  }
  .calendar-day.today .day-dot { background: #1f2328; }
  .calendar-day .day-popup {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: 6px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 8px;
    width: max-content;
    max-width: 220px;
    z-index: 25;
    text-align: left;
    cursor: default;
  }
  .calendar-day.has-events:hover .day-popup,
  .calendar-day.popup-open .day-popup { display: block; }
  .day-popup-item {
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }
  .day-popup-item:last-child { border-bottom: none; }
  .day-popup-view {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px;
  }
  .day-popup-text {
    font-size: 12px;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .day-popup-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }
  .day-popup-actions button {
    background: transparent;
    color: var(--text-muted);
    padding: 0 4px;
    font-size: 11px;
  }
  .day-popup-edit { margin-top: 4px; }
  .day-popup-edit input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 6px;
    font-family: inherit;
    font-size: 12px;
    background: transparent;
    color: var(--text);
    margin-bottom: 4px;
  }
  .day-popup-edit select {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 4px;
    font-family: inherit;
    font-size: 11.5px;
    background: var(--card-bg);
    color: var(--text);
    margin-bottom: 4px;
  }
  .day-popup-edit-actions {
    display: flex;
    justify-content: flex-end;
    gap: 4px;
  }
  .day-popup-edit-actions button { padding: 3px 8px; font-size: 11px; }
  .day-popup-save-btn { background: var(--accent); color: #1f2328; }
  .day-popup-cancel-btn { background: var(--border); color: var(--text); }
  .calendar-add-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .calendar-add-row input[type="date"] {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 8px;
    font-family: inherit;
    font-size: 13px;
    background: var(--card-bg);
    color: var(--text);
  }
  .calendar-add-row input[type="text"] {
    flex: 1;
    min-width: 120px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-family: inherit;
    font-size: 13.5px;
    background: transparent;
    color: var(--text);
  }
  .calendar-add-row select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 6px;
    font-family: inherit;
    font-size: 13px;
    background: var(--card-bg);
    color: var(--text);
  }
  #calAddBtn { background: var(--accent); color: #1f2328; padding: 7px 14px; }
  .todo-item .source-badge {
    font-size: 10px;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 4px;
  }
</style>
</head>
<body>
<div class="app">
<div class="app-header">
  <header>
    <h1>📝 업무일지</h1>
    <span class="count" id="entryCount"></span>
  </header>

  <div class="io-row">
    <button type="button" id="exportBtn">⬇ 백업 다운로드</button>
    <button type="button" id="importBtn">⬆ 백업 업로드</button>
    <input type="file" id="importFile" accept="application/json" class="hidden">
    <span class="io-status" id="ioStatus"></span>
  </div>
</div>

<div class="left-col">
  <section class="todo-card" id="todoSection">
    <div class="todo-header">
      <h2>✅ TODO</h2>
      <button id="pipBtn">📌 항상 위 고정</button>
    </div>
    <div class="todo-input-row">
      <input type="text" id="todoInput" placeholder="할 일을 입력하세요">
      <select id="todoCategoryInput"></select>
      <button id="todoAddBtn">추가</button>
    </div>
    <ul class="todo-list" id="todoList"></ul>
    <div class="todo-hint" id="pipHint"></div>
  </section>
  <div class="todo-placeholder hidden" id="todoPlaceholder">📌 TODO 목록이 고정 창에 표시되고 있습니다.</div>

  <section class="summary-card" id="summarySection">
    <div class="summary-header">
      <h2>📅 이번 주 요약</h2>
      <span class="summary-range" id="summaryRange"></span>
    </div>
    <div id="summaryBody"></div>
  </section>

  <div class="search-row">
    <input type="text" id="searchInput" placeholder="🔍 검색어 (내용/카테고리)">
    <select id="searchCategoryInput"></select>
    <input type="date" id="searchDateInput">
    <button type="button" id="resetSearchBtn">초기화</button>
  </div>

  <section class="entry-list" id="entryList"></section>
</div>

<div class="right-col">
  <section class="daily-card">
    <div class="daily-header">
      <h2>🔁 Daily 업무</h2>
    </div>
    <div class="daily-input-row">
      <input type="text" id="dailyInput" placeholder="매일/매주 할 일을 입력하세요">
      <select id="dailyFrequencyInput">
        <option value="daily">매일</option>
        <option value="weekly">매주</option>
      </select>
      <select id="dailyWeekdayInput" class="hidden">
        <option value="0">일</option>
        <option value="1">월</option>
        <option value="2">화</option>
        <option value="3">수</option>
        <option value="4">목</option>
        <option value="5">금</option>
        <option value="6">토</option>
      </select>
      <select id="dailyCategoryInput"></select>
      <button id="dailyAddBtn">추가</button>
    </div>
    <ul class="todo-list" id="dailyList"></ul>
  </section>

  <section class="form-card">
    <textarea id="contentInput" placeholder="오늘 한 업무를 입력하세요..."></textarea>
    <div class="datetime-row">
      <label>시작 <input type="datetime-local" id="startInput"></label>
      <label><input type="checkbox" id="rangeToggle"> 기간으로 설정</label>
      <label id="endLabel" class="hidden">종료 <input type="datetime-local" id="endInput"></label>
    </div>
    <div class="category-row">
      <label>카테고리 <select id="categoryInput"></select></label>
      <button type="button" class="category-manage-btn" id="categoryManageBtn">카테고리 관리</button>
    </div>
    <div class="category-panel hidden" id="categoryPanel">
      <div class="category-chip-list" id="categoryChipList"></div>
      <div class="category-add-row">
        <input type="text" id="newCategoryInput" placeholder="새 카테고리 이름">
        <button type="button" id="addCategoryBtn">추가</button>
      </div>
    </div>
    <div class="actions">
      <button id="cancelEditBtn" class="hidden">취소</button>
      <button id="saveBtn">저장</button>
    </div>
  </section>

  <section class="calendar-card">
    <div class="calendar-header">
      <button type="button" id="calPrevBtn">‹</button>
      <span id="calTitle"></span>
      <button type="button" id="calNextBtn">›</button>
    </div>
    <div class="calendar-grid" id="calGrid"></div>
    <div class="calendar-add-row">
      <input type="date" id="calDateInput">
      <input type="text" id="calTextInput" placeholder="해당 날짜에 할 일을 입력하세요">
      <select id="calCategoryInput"></select>
      <button type="button" id="calAddBtn">추가</button>
    </div>
  </section>

</div>

<script>
(function () {
  const STORAGE_KEY = 'workLog.entries';
  const TODO_STORAGE_KEY = 'workLog.todos';
  const CATEGORY_STORAGE_KEY = 'workLog.categories';
  const DEFAULT_CATEGORIES = ['회의', '개발', '문서·보고', '고객대응', '기타'];

  const contentInput = document.getElementById('contentInput');
  const startInput = document.getElementById('startInput');
  const endInput = document.getElementById('endInput');
  const endLabel = document.getElementById('endLabel');
  const rangeToggle = document.getElementById('rangeToggle');
  const saveBtn = document.getElementById('saveBtn');
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  const entryList = document.getElementById('entryList');
  const entryCount = document.getElementById('entryCount');

  const todoSection = document.getElementById('todoSection');
  const todoPlaceholder = document.getElementById('todoPlaceholder');
  const todoInput = document.getElementById('todoInput');
  const todoCategoryInput = document.getElementById('todoCategoryInput');
  const todoAddBtn = document.getElementById('todoAddBtn');
  const todoList = document.getElementById('todoList');
  const pipBtn = document.getElementById('pipBtn');
  const pipHint = document.getElementById('pipHint');

  const categoryInput = document.getElementById('categoryInput');
  const categoryManageBtn = document.getElementById('categoryManageBtn');
  const categoryPanel = document.getElementById('categoryPanel');
  const categoryChipList = document.getElementById('categoryChipList');
  const newCategoryInput = document.getElementById('newCategoryInput');
  const addCategoryBtn = document.getElementById('addCategoryBtn');
  const summaryRange = document.getElementById('summaryRange');
  const summaryBody = document.getElementById('summaryBody');

  const searchInput = document.getElementById('searchInput');
  const searchCategoryInput = document.getElementById('searchCategoryInput');
  const searchDateInput = document.getElementById('searchDateInput');
  const resetSearchBtn = document.getElementById('resetSearchBtn');

  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');
  const ioStatus = document.getElementById('ioStatus');

  const dailyInput = document.getElementById('dailyInput');
  const dailyFrequencyInput = document.getElementById('dailyFrequencyInput');
  const dailyWeekdayInput = document.getElementById('dailyWeekdayInput');
  const dailyCategoryInput = document.getElementById('dailyCategoryInput');
  const dailyAddBtn = document.getElementById('dailyAddBtn');
  const dailyList = document.getElementById('dailyList');

  const calPrevBtn = document.getElementById('calPrevBtn');
  const calNextBtn = document.getElementById('calNextBtn');
  const calTitle = document.getElementById('calTitle');
  const calGrid = document.getElementById('calGrid');
  const calDateInput = document.getElementById('calDateInput');
  const calTextInput = document.getElementById('calTextInput');
  const calCategoryInput = document.getElementById('calCategoryInput');
  const calAddBtn = document.getElementById('calAddBtn');
  let calViewDate = new Date();
  let openCalendarDate = null;

  let editingId = null;
  let pipWindow = null;

  function loadEntries() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveEntries(entries) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function toDatetimeLocalValue(date) {
    const pad = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  function formatKorean(isoString) {
    const d = new Date(isoString);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}년 ${pad(d.getMonth() + 1)}월 ${pad(d.getDate())}일 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function formatKoreanShort(isoString) {
    const d = new Date(isoString);
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // 네이티브 confirm()은 일부 미리보기 환경(샌드박스 iframe)에서 차단될 수 있어
  // "한 번 더 누르면 삭제" 방식의 자체 확인으로 대체.
  function bindDeleteConfirm(btn, onConfirm) {
    btn.addEventListener('click', () => {
      if (btn.dataset.confirming === '1') {
        onConfirm();
        return;
      }
      btn.dataset.confirming = '1';
      const original = btn.textContent;
      btn.textContent = '정말 삭제?';
      btn.classList.add('confirming');
      setTimeout(() => {
        btn.dataset.confirming = '0';
        btn.textContent = original;
        btn.classList.remove('confirming');
      }, 2500);
    });
  }

  // ---- 카테고리 색상 ----
  // 색상환에 고르게 흩어진 14색. 카테고리 이름을 해시해 기본 슬롯을 정하되,
  // 사용자가 카테고리 관리에서 직접 슬롯을 골라 덮어쓸 수 있다(workLog.categoryColors).
  const CATEGORY_COLOR_SLOTS = [
    { light: '#2573c1', dark: '#699ed3' },
    { light: '#2530c1', dark: '#6970d3' },
    { light: '#5c25c1', dark: '#8f69d3' },
    { light: '#9f25c1', dark: '#bd69d3' },
    { light: '#c1259f', dark: '#d369bd' },
    { light: '#c1255c', dark: '#d3698f' },
    { light: '#c13025', dark: '#d37069' },
    { light: '#c17325', dark: '#d39e69' },
    { light: '#c1b625', dark: '#d3cc69' },
    { light: '#89c125', dark: '#add369' },
    { light: '#46c125', dark: '#80d369' },
    { light: '#25c146', dark: '#69d380' },
    { light: '#25c189', dark: '#69d3ad' },
    { light: '#25b6c1', dark: '#69ccd3' },
  ];

  const CATEGORY_COLOR_MAP_KEY = 'workLog.categoryColors';

  function loadCategoryColorMap() {
    try {
      return JSON.parse(localStorage.getItem(CATEGORY_COLOR_MAP_KEY)) || {};
    } catch {
      return {};
    }
  }

  function saveCategoryColorMap(map) {
    localStorage.setItem(CATEGORY_COLOR_MAP_KEY, JSON.stringify(map));
  }

  function setCategoryColorOverride(name, slotIndex) {
    const map = loadCategoryColorMap();
    if (slotIndex === null) {
      delete map[name];
    } else {
      map[name] = slotIndex;
    }
    saveCategoryColorMap(map);
  }

  function hashCategoryName(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
      hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    }
    return hash % CATEGORY_COLOR_SLOTS.length;
  }

  function getCategorySlotIndex(name) {
    const overrides = loadCategoryColorMap();
    if (Number.isInteger(overrides[name]) && CATEGORY_COLOR_SLOTS[overrides[name]]) {
      return overrides[name];
    }
    return hashCategoryName(name);
  }

  function isDarkMode() {
    const theme = document.documentElement.getAttribute('data-theme');
    if (theme === 'dark') return true;
    if (theme === 'light') return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }

  function pickTextColor(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    const lin = (c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
    const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    return L > 0.45 ? '#1f2328' : '#ffffff';
  }

  function getCategoryColor(name) {
    if (!name) return null;
    const slot = CATEGORY_COLOR_SLOTS[getCategorySlotIndex(name)];
    const bg = isDarkMode() ? slot.dark : slot.light;
    return { bg, text: pickTextColor(bg) };
  }

  function applyCategoryTagColor(el, name) {
    const color = getCategoryColor(name);
    if (color) {
      el.style.background = color.bg;
      el.style.color = color.text;
      el.style.borderColor = color.bg;
    } else {
      el.style.background = '';
      el.style.color = '';
      el.style.borderColor = '';
    }
  }

  // ---- 카테고리 ----

  function loadCategories() {
    try {
      const stored = JSON.parse(localStorage.getItem(CATEGORY_STORAGE_KEY));
      if (Array.isArray(stored)) return stored;
    } catch {}
    saveCategories(DEFAULT_CATEGORIES);
    return [...DEFAULT_CATEGORIES];
  }

  function saveCategories(categories) {
    localStorage.setItem(CATEGORY_STORAGE_KEY, JSON.stringify(categories));
  }

  function buildCategoryOptions(selectEl, currentValue) {
    const categories = loadCategories();
    selectEl.innerHTML = '';
    const noneOpt = document.createElement('option');
    noneOpt.value = '';
    noneOpt.textContent = '미분류';
    selectEl.appendChild(noneOpt);
    categories.forEach((c) => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      selectEl.appendChild(opt);
    });
    selectEl.value = categories.includes(currentValue) ? currentValue : '';
  }

  function renderCategorySelect(selectedValue) {
    const current = selectedValue !== undefined ? selectedValue : categoryInput.value;
    buildCategoryOptions(categoryInput, current);
  }

  function refreshTodoCategoryInput() {
    buildCategoryOptions(todoCategoryInput, todoCategoryInput.value);
  }

  function refreshSearchCategoryInput() {
    const current = searchCategoryInput.value;
    const categories = loadCategories();
    searchCategoryInput.innerHTML = '';
    const allOpt = document.createElement('option');
    allOpt.value = '';
    allOpt.textContent = '전체 카테고리';
    searchCategoryInput.appendChild(allOpt);
    const noneOpt = document.createElement('option');
    noneOpt.value = '__uncategorized__';
    noneOpt.textContent = '미분류';
    searchCategoryInput.appendChild(noneOpt);
    categories.forEach((c) => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      searchCategoryInput.appendChild(opt);
    });
    searchCategoryInput.value = current === '__uncategorized__' || categories.includes(current) ? current : '';
  }

  function renderCategoryChips() {
    const categories = loadCategories();
    categoryChipList.innerHTML = '';
    if (!categories.length) {
      const empty = document.createElement('span');
      empty.className = 'summary-empty';
      empty.style.padding = '0';
      empty.textContent = '등록된 카테고리가 없습니다.';
      categoryChipList.appendChild(empty);
      return;
    }
    categories.forEach((c) => {
      const wrap = document.createElement('span');
      wrap.className = 'category-chip-wrap';

      const chip = document.createElement('span');
      chip.className = 'category-chip';
      const color = getCategoryColor(c);
      if (color) {
        chip.style.background = color.bg;
        chip.style.borderColor = color.bg;
        chip.style.color = color.text;
      }
      const label = document.createElement('span');
      label.textContent = c;
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = '×';
      if (color) removeBtn.style.color = color.text;
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeCategory(c);
      });
      chip.appendChild(label);
      chip.appendChild(removeBtn);

      const panel = document.createElement('div');
      panel.className = 'color-swatch-panel';
      const grid = document.createElement('div');
      grid.className = 'color-swatch-grid';
      const currentIndex = getCategorySlotIndex(c);
      CATEGORY_COLOR_SLOTS.forEach((slot, idx) => {
        const swatch = document.createElement('button');
        swatch.type = 'button';
        swatch.className = 'color-swatch' + (idx === currentIndex ? ' selected' : '');
        swatch.style.background = isDarkMode() ? slot.dark : slot.light;
        swatch.title = `색상 ${idx + 1}`;
        swatch.addEventListener('click', () => {
          setCategoryColorOverride(c, idx);
          renderCategoryChips();
          render();
          renderTodos();
        });
        grid.appendChild(swatch);
      });
      const autoBtn = document.createElement('button');
      autoBtn.type = 'button';
      autoBtn.className = 'color-swatch-auto-btn';
      autoBtn.textContent = '자동 배정으로';
      autoBtn.addEventListener('click', () => {
        setCategoryColorOverride(c, null);
        renderCategoryChips();
        render();
        renderTodos();
      });
      panel.appendChild(grid);
      panel.appendChild(autoBtn);

      chip.addEventListener('click', () => {
        document.querySelectorAll('.color-swatch-panel.open').forEach((p) => {
          if (p !== panel) p.classList.remove('open');
        });
        panel.classList.toggle('open');
      });

      wrap.appendChild(chip);
      wrap.appendChild(panel);
      categoryChipList.appendChild(wrap);
    });
  }

  function addCategory() {
    const name = newCategoryInput.value.trim();
    if (!name) {
      newCategoryInput.focus();
      return;
    }
    const categories = loadCategories();
    if (!categories.includes(name)) {
      categories.push(name);
      saveCategories(categories);
    }
    newCategoryInput.value = '';
    renderCategoryChips();
    renderCategorySelect();
    refreshTodoCategoryInput();
    refreshSearchCategoryInput();
    refreshDailyCategoryInput();
    refreshCalCategoryInput();
    newCategoryInput.focus();
  }

  function removeCategory(name) {
    saveCategories(loadCategories().filter((c) => c !== name));
    renderCategoryChips();
    renderCategorySelect();
    refreshTodoCategoryInput();
    refreshSearchCategoryInput();
    refreshDailyCategoryInput();
    refreshCalCategoryInput();
  }

  categoryManageBtn.addEventListener('click', () => {
    categoryPanel.classList.toggle('hidden');
    if (!categoryPanel.classList.contains('hidden')) renderCategoryChips();
  });
  addCategoryBtn.addEventListener('click', addCategory);
  newCategoryInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addCategory();
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('.category-chip-wrap')) return;
    document.querySelectorAll('.color-swatch-panel.open').forEach((p) => p.classList.remove('open'));
  });

  // ---- 주간 요약 ----

  function getWeekRange(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    const day = d.getDay();
    const diffToMonday = day === 0 ? -6 : 1 - day;
    const start = new Date(d);
    start.setDate(d.getDate() + diffToMonday);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    end.setHours(23, 59, 59, 999);
    return { start, end };
  }

  function formatDateShort(d) {
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}년 ${pad(d.getMonth() + 1)}월 ${pad(d.getDate())}일`;
  }

  // TODO 완료 이관 시 "제목\n\n메모" 형태로 합쳐진 content를 요약 카드에서
  // 다시 나눠 보여주기 위한 분리 함수. 이중 줄바꿈이 없으면 메모 없음으로 간주.
  function splitEntryContent(content) {
    const idx = content.indexOf('\n\n');
    if (idx === -1) return { title: content, memo: '' };
    return { title: content.slice(0, idx), memo: content.slice(idx + 2) };
  }

  function renderSummary() {
    const { start, end } = getWeekRange(new Date());
    summaryRange.textContent = `${formatDateShort(start)} ~ ${formatDateShort(end)}`;

    const entries = loadEntries().filter((e) => {
      const t = new Date(e.start).getTime();
      return t >= start.getTime() && t <= end.getTime();
    });

    summaryBody.innerHTML = '';

    if (!entries.length) {
      const empty = document.createElement('div');
      empty.className = 'summary-empty';
      empty.textContent = '이번 주에 작성된 업무일지가 없습니다.';
      summaryBody.appendChild(empty);
      return;
    }

    const groups = {};
    entries.forEach((e) => {
      const key = e.category || '미분류';
      (groups[key] = groups[key] || []).push(e);
    });

    Object.keys(groups)
      .sort((a, b) => groups[b].length - groups[a].length)
      .forEach((key) => {
        const items = groups[key].sort((a, b) => new Date(a.start) - new Date(b.start));

        const groupEl = document.createElement('div');
        groupEl.className = 'summary-group';

        const titleEl = document.createElement('div');
        titleEl.className = 'summary-group-title';
        const dotEl = document.createElement('span');
        dotEl.className = 'category-dot';
        const groupColor = getCategoryColor(key === '미분류' ? null : key);
        if (groupColor) dotEl.style.background = groupColor.bg;
        titleEl.appendChild(dotEl);
        titleEl.appendChild(document.createTextNode(key + ' '));
        const countEl = document.createElement('span');
        countEl.className = 'count';
        countEl.textContent = `${items.length}건`;
        titleEl.appendChild(countEl);
        groupEl.appendChild(titleEl);

        items.forEach((e) => {
          const { title, memo } = splitEntryContent(e.content);

          const itemEl = document.createElement('div');
          itemEl.className = 'summary-item';
          const timeEl = document.createElement('span');
          timeEl.className = 'summary-time';
          timeEl.textContent = formatKoreanShort(e.start);
          const textEl = document.createElement('span');
          textEl.className = 'summary-text';
          textEl.textContent = title;
          itemEl.appendChild(timeEl);
          itemEl.appendChild(textEl);

          if (memo) {
            itemEl.appendChild(document.createTextNode(' '));
            const trigger = document.createElement('span');
            trigger.className = 'memo-trigger';
            const label = document.createElement('span');
            label.className = 'memo-trigger-label';
            label.textContent = '📝';
            const popup = document.createElement('span');
            popup.className = 'memo-popup';
            popup.textContent = memo;
            trigger.appendChild(label);
            trigger.appendChild(popup);
            itemEl.appendChild(trigger);
          }

          groupEl.appendChild(itemEl);
        });

        summaryBody.appendChild(groupEl);
      });
  }

  function getTodayStr() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  // ---- 공용 항목 UI (TODO/데일리/달력이 함께 쓰는 체크+메모+카테고리 항목 렌더링) ----

  function buildItemLi(item, opts) {
    const badge = opts && opts.badge ? `<span class="source-badge">${opts.badge}</span>` : '';
    return `
      <li class="todo-item" data-key="${item.__key}">
        <input type="checkbox" class="todo-check">
        <div class="todo-body">
          <div class="todo-text-row">
            <span class="todo-text"></span>
            ${badge}
            <span class="category-tag"></span>
            <span class="memo-trigger">
              <span class="memo-trigger-label"></span>
              <span class="memo-popup"></span>
            </span>
          </div>
          <div class="todo-meta">생성 ${formatKoreanShort(item.createdAt)}</div>
          <div class="memo-edit hidden">
            <textarea class="memo-textarea" placeholder="상세 메모를 입력하세요"></textarea>
            <div class="memo-edit-actions">
              <label class="memo-category-label">카테고리 <select class="memo-category-select"></select></label>
              <div class="memo-edit-buttons">
                <button type="button" class="memo-cancel-btn">취소</button>
                <button type="button" class="memo-save-btn">저장</button>
              </div>
            </div>
          </div>
        </div>
        <button class="icon-btn danger delete-btn">삭제</button>
      </li>
    `;
  }

  function bindItemLi(li, item, handlers) {
    li.querySelector('.todo-text').textContent = item.text;
    li.querySelector('.todo-check').addEventListener('change', (e) => {
      if (e.target.checked) handlers.onComplete(item);
    });
    bindDeleteConfirm(li.querySelector('.delete-btn'), () => handlers.onDelete(item));

    const tag = li.querySelector('.category-tag');
    tag.textContent = item.category || '미분류';
    applyCategoryTagColor(tag, item.category);

    const memoTrigger = li.querySelector('.memo-trigger');
    const memoLabel = li.querySelector('.memo-trigger-label');
    const memoPopup = li.querySelector('.memo-popup');
    const memoEdit = li.querySelector('.memo-edit');
    const memoTextarea = li.querySelector('.memo-textarea');
    const memoCategorySelect = li.querySelector('.memo-category-select');

    memoLabel.textContent = item.memo ? '📝 메모' : '+ 메모';
    memoPopup.textContent = item.memo || '';
    buildCategoryOptions(memoCategorySelect, item.category || '');

    memoTrigger.addEventListener('click', () => {
      memoTextarea.value = item.memo || '';
      buildCategoryOptions(memoCategorySelect, item.category || '');
      memoEdit.classList.toggle('hidden');
      if (!memoEdit.classList.contains('hidden')) memoTextarea.focus();
    });
    li.querySelector('.memo-cancel-btn').addEventListener('click', () => {
      memoEdit.classList.add('hidden');
    });
    li.querySelector('.memo-save-btn').addEventListener('click', () => {
      handlers.onSaveMemo(item, memoTextarea.value.trim(), memoCategorySelect.value || null);
    });
  }

  // ---- TODO ----

  function loadTodos() {
    try {
      return JSON.parse(localStorage.getItem(TODO_STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  // 이전 버전(체크 시 목록에 남아있던 방식)에서 완료 표시된 TODO가 있다면
  // 업무일지 항목으로 옮기고 TODO 목록에서 제거한다. 1회성 이관.
  function migrateCompletedTodos() {
    const todos = loadTodos();
    const completed = todos.filter((t) => t.done);
    if (!completed.length) return;

    const entries = loadEntries();
    completed.forEach((t) => {
      const stamp = t.completedAt || t.createdAt || new Date().toISOString();
      entries.push({
        id: crypto.randomUUID(),
        content: t.memo ? `${t.text}\n\n${t.memo}` : t.text,
        start: stamp,
        end: null,
        category: t.category || null,
        createdAt: stamp,
        updatedAt: stamp,
      });
    });
    saveEntries(entries);
    saveTodos(todos.filter((t) => !t.done));
  }

  function saveTodos(todos) {
    localStorage.setItem(TODO_STORAGE_KEY, JSON.stringify(todos));
  }

  function addTodo() {
    const text = todoInput.value.trim();
    if (!text) {
      todoInput.focus();
      return;
    }
    const todos = loadTodos();
    todos.push({
      id: crypto.randomUUID(),
      text,
      memo: '',
      category: todoCategoryInput.value || null,
      createdAt: new Date().toISOString(),
    });
    saveTodos(todos);
    todoInput.value = '';
    todoCategoryInput.value = '';
    todoInput.focus();
    renderTodos();
  }

  // 체크 완료 시 TODO 목록에서 사라지고, 수기 작성과 동일한 업무일지 항목으로 전환된다.
  function completeTodo(id) {
    const todos = loadTodos();
    const todo = todos.find((t) => t.id === id);
    if (!todo) return;

    const nowIso = new Date().toISOString();
    const entries = loadEntries();
    entries.push({
      id: crypto.randomUUID(),
      content: todo.memo ? `${todo.text}\n\n${todo.memo}` : todo.text,
      start: nowIso,
      end: null,
      category: todo.category || null,
      createdAt: nowIso,
      updatedAt: nowIso,
    });
    saveEntries(entries);
    saveTodos(todos.filter((t) => t.id !== id));

    renderTodos();
    render();
  }

  function saveTodoMemo(id, memo, category) {
    const todos = loadTodos().map((t) => (t.id === id ? { ...t, memo, category } : t));
    saveTodos(todos);
    renderTodos();
  }

  function deleteTodo(id) {
    saveTodos(loadTodos().filter((t) => t.id !== id));
    renderTodos();
  }

  // 오늘 날짜에 해당하는 달력 이벤트를 맨 위에 얹어 기존 TODO와 같은 목록으로 보여준다.
  function renderTodos() {
    const todayStr = getTodayStr();
    const todos = loadTodos()
      .map((t) => ({ ...t, __key: `todo:${t.id}`, __source: 'todo' }))
      .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
    const todayEvents = loadCalendarEvents()
      .filter((ev) => ev.date === todayStr)
      .map((ev) => ({ ...ev, __key: `cal:${ev.id}`, __source: 'calendar' }))
      .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

    const items = [...todayEvents, ...todos];

    if (!items.length) {
      todoList.innerHTML = '<li class="todo-empty">할 일이 없습니다.</li>';
      return;
    }

    todoList.innerHTML = items
      .map((item) => buildItemLi(item, item.__source === 'calendar' ? { badge: '📅 오늘' } : null))
      .join('');

    const handlers = {
      onComplete: (item) => (item.__source === 'calendar' ? completeCalendarEvent(item.id) : completeTodo(item.id)),
      onDelete: (item) => (item.__source === 'calendar' ? deleteCalendarEvent(item.id) : deleteTodo(item.id)),
      onSaveMemo: (item, memo, category) =>
        item.__source === 'calendar'
          ? saveCalendarEventMemo(item.id, memo, category)
          : saveTodoMemo(item.id, memo, category),
    };

    todoList.querySelectorAll('.todo-item').forEach((li) => {
      const item = items.find((it) => it.__key === li.getAttribute('data-key'));
      if (item) bindItemLi(li, item, handlers);
    });
  }

  todoAddBtn.addEventListener('click', addTodo);
  todoInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTodo();
  });

  // ---- 데일리 업무 (날짜가 바뀌면 자동으로 다시 나타나는 반복 업무) ----

  const WEEKDAY_LABELS = ['일', '월', '화', '수', '목', '금', '토'];
  const DAILY_STORAGE_KEY = 'workLog.dailyTemplates';
  const DAILY_COMPLETIONS_KEY = 'workLog.dailyCompletions';

  function loadDailyTemplates() {
    try {
      return JSON.parse(localStorage.getItem(DAILY_STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveDailyTemplates(templates) {
    localStorage.setItem(DAILY_STORAGE_KEY, JSON.stringify(templates));
  }

  function loadDailyCompletions() {
    try {
      return JSON.parse(localStorage.getItem(DAILY_COMPLETIONS_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveDailyCompletions(completions) {
    localStorage.setItem(DAILY_COMPLETIONS_KEY, JSON.stringify(completions));
  }

  function addDailyTemplate() {
    const text = dailyInput.value.trim();
    if (!text) {
      dailyInput.focus();
      return;
    }
    const frequency = dailyFrequencyInput.value;
    const weekday = frequency === 'weekly' ? parseInt(dailyWeekdayInput.value, 10) : null;
    const templates = loadDailyTemplates();
    templates.push({
      id: crypto.randomUUID(),
      text,
      memo: '',
      category: dailyCategoryInput.value || null,
      frequency,
      weekday,
      createdAt: new Date().toISOString(),
    });
    saveDailyTemplates(templates);
    dailyInput.value = '';
    dailyCategoryInput.value = '';
    dailyInput.focus();
    renderDaily();
  }

  // 완료 시 업무일지로 이관 + 오늘 날짜로 완료 기록. 이 기록이 없는 날엔 다시 나타나므로
  // 별도의 "재생성" 로직 없이 날짜 기준 필터만으로 매일/매주 반복이 구현된다.
  function completeDailyToday(id) {
    const templates = loadDailyTemplates();
    const template = templates.find((t) => t.id === id);
    if (!template) return;

    const nowIso = new Date().toISOString();
    const entries = loadEntries();
    entries.push({
      id: crypto.randomUUID(),
      content: template.memo ? `${template.text}\n\n${template.memo}` : template.text,
      start: nowIso,
      end: null,
      category: template.category || null,
      createdAt: nowIso,
      updatedAt: nowIso,
    });
    saveEntries(entries);

    const completions = loadDailyCompletions();
    completions.push({ templateId: id, date: getTodayStr() });
    saveDailyCompletions(completions);

    renderDaily();
    render();
  }

  function deleteDailyTemplate(id) {
    saveDailyTemplates(loadDailyTemplates().filter((t) => t.id !== id));
    saveDailyCompletions(loadDailyCompletions().filter((c) => c.templateId !== id));
    renderDaily();
  }

  function saveDailyMemo(id, memo, category) {
    saveDailyTemplates(loadDailyTemplates().map((t) => (t.id === id ? { ...t, memo, category } : t)));
    renderDaily();
  }

  function renderDaily() {
    const todayStr = getTodayStr();
    const todayWeekday = new Date().getDay();
    const templates = loadDailyTemplates();
    const completedTodayIds = new Set(
      loadDailyCompletions().filter((c) => c.date === todayStr).map((c) => c.templateId)
    );

    const active = templates
      .filter((t) => (t.frequency === 'daily' || t.weekday === todayWeekday) && !completedTodayIds.has(t.id))
      .map((t) => ({ ...t, __key: `daily:${t.id}` }))
      .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

    if (!active.length) {
      dailyList.innerHTML = '<li class="todo-empty">오늘의 Daily 업무가 없습니다.</li>';
      return;
    }

    dailyList.innerHTML = active
      .map((item) =>
        buildItemLi(item, { badge: item.frequency === 'weekly' ? `매주 ${WEEKDAY_LABELS[item.weekday]}` : '매일' })
      )
      .join('');

    const handlers = {
      onComplete: (item) => completeDailyToday(item.id),
      onDelete: (item) => deleteDailyTemplate(item.id),
      onSaveMemo: (item, memo, category) => saveDailyMemo(item.id, memo, category),
    };

    dailyList.querySelectorAll('.todo-item').forEach((li) => {
      const item = active.find((it) => it.__key === li.getAttribute('data-key'));
      if (item) bindItemLi(li, item, handlers);
    });
  }

  function refreshDailyCategoryInput() {
    buildCategoryOptions(dailyCategoryInput, dailyCategoryInput.value);
  }

  dailyFrequencyInput.addEventListener('change', () => {
    dailyWeekdayInput.classList.toggle('hidden', dailyFrequencyInput.value !== 'weekly');
    if (dailyFrequencyInput.value === 'weekly') dailyWeekdayInput.value = String(new Date().getDay());
  });
  dailyAddBtn.addEventListener('click', addDailyTemplate);
  dailyInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addDailyTemplate();
  });

  // ---- 달력 (특정 날짜에 할 일을 걸어두면 그날 TODO 목록 맨 위에 표시) ----

  const CALENDAR_STORAGE_KEY = 'workLog.calendarEvents';

  function loadCalendarEvents() {
    try {
      return JSON.parse(localStorage.getItem(CALENDAR_STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveCalendarEvents(events) {
    localStorage.setItem(CALENDAR_STORAGE_KEY, JSON.stringify(events));
  }

  function addCalendarEvent() {
    const date = calDateInput.value;
    const text = calTextInput.value.trim();
    if (!date || !text) {
      (date ? calTextInput : calDateInput).focus();
      return;
    }
    const events = loadCalendarEvents();
    events.push({
      id: crypto.randomUUID(),
      text,
      memo: '',
      category: calCategoryInput.value || null,
      date,
      createdAt: new Date().toISOString(),
    });
    saveCalendarEvents(events);
    calTextInput.value = '';
    calCategoryInput.value = '';
    renderCalendar();
    renderTodos();
  }

  function refreshCalCategoryInput() {
    buildCategoryOptions(calCategoryInput, calCategoryInput.value);
  }

  function completeCalendarEvent(id) {
    const events = loadCalendarEvents();
    const ev = events.find((e) => e.id === id);
    if (!ev) return;
    const nowIso = new Date().toISOString();
    const entries = loadEntries();
    entries.push({
      id: crypto.randomUUID(),
      content: ev.memo ? `${ev.text}\n\n${ev.memo}` : ev.text,
      start: nowIso,
      end: null,
      category: ev.category || null,
      createdAt: nowIso,
      updatedAt: nowIso,
    });
    saveEntries(entries);
    saveCalendarEvents(events.filter((e) => e.id !== id));
    renderCalendar();
    renderTodos();
    render();
  }

  function deleteCalendarEvent(id) {
    saveCalendarEvents(loadCalendarEvents().filter((e) => e.id !== id));
    renderCalendar();
    renderTodos();
  }

  function saveCalendarEventMemo(id, memo, category) {
    saveCalendarEvents(loadCalendarEvents().map((e) => (e.id === id ? { ...e, memo, category } : e)));
    renderCalendar();
    renderTodos();
  }

  function saveCalendarEventText(id, text, category) {
    if (!text) return;
    saveCalendarEvents(loadCalendarEvents().map((e) => (e.id === id ? { ...e, text, category } : e)));
    renderCalendar();
    renderTodos();
  }

  function renderCalendar() {
    const year = calViewDate.getFullYear();
    const month = calViewDate.getMonth();
    calTitle.textContent = `${year}년 ${month + 1}월`;

    const todayStr = getTodayStr();
    const eventsByDate = {};
    loadCalendarEvents().forEach((ev) => {
      (eventsByDate[ev.date] = eventsByDate[ev.date] || []).push(ev);
    });

    const startWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const pad = (n) => String(n).padStart(2, '0');

    calGrid.innerHTML = '';
    WEEKDAY_LABELS.forEach((label) => {
      const el = document.createElement('div');
      el.className = 'calendar-weekday';
      el.textContent = label;
      calGrid.appendChild(el);
    });

    for (let i = 0; i < startWeekday; i++) {
      const el = document.createElement('div');
      el.className = 'calendar-day empty';
      calGrid.appendChild(el);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${year}-${pad(month + 1)}-${pad(day)}`;
      const dayEvents = eventsByDate[dateStr] || [];

      const cell = document.createElement('div');
      cell.className = 'calendar-day';
      if (dateStr === todayStr) cell.classList.add('today');
      if (dayEvents.length) cell.classList.add('has-events');
      if (dateStr === openCalendarDate) cell.classList.add('popup-open');

      const numberEl = document.createElement('span');
      numberEl.textContent = String(day);
      cell.appendChild(numberEl);

      if (dayEvents.length) {
        const dot = document.createElement('span');
        dot.className = 'day-dot';
        cell.appendChild(dot);

        const popup = document.createElement('div');
        popup.className = 'day-popup';
        // 팝업 안 클릭은 날짜 셀의 클릭(핀 토글/날짜입력 갱신)으로 전파되지 않게 막는다.
        popup.addEventListener('click', (e) => e.stopPropagation());

        dayEvents.forEach((ev) => {
          const item = document.createElement('div');
          item.className = 'day-popup-item';

          const view = document.createElement('div');
          view.className = 'day-popup-view';
          const textEl = document.createElement('span');
          textEl.className = 'day-popup-text';
          textEl.textContent = ev.text;
          const actions = document.createElement('div');
          actions.className = 'day-popup-actions';
          const editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.textContent = '수정';
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.textContent = '×';
          actions.appendChild(editBtn);
          actions.appendChild(delBtn);
          view.appendChild(textEl);
          view.appendChild(actions);

          const editRow = document.createElement('div');
          editRow.className = 'day-popup-edit hidden';
          const editInput = document.createElement('input');
          editInput.type = 'text';
          const editCategory = document.createElement('select');
          const editActions = document.createElement('div');
          editActions.className = 'day-popup-edit-actions';
          const cancelBtn = document.createElement('button');
          cancelBtn.type = 'button';
          cancelBtn.className = 'day-popup-cancel-btn';
          cancelBtn.textContent = '취소';
          const saveBtn = document.createElement('button');
          saveBtn.type = 'button';
          saveBtn.className = 'day-popup-save-btn';
          saveBtn.textContent = '저장';
          editActions.appendChild(cancelBtn);
          editActions.appendChild(saveBtn);
          editRow.appendChild(editInput);
          editRow.appendChild(editCategory);
          editRow.appendChild(editActions);

          editBtn.addEventListener('click', () => {
            editInput.value = ev.text;
            buildCategoryOptions(editCategory, ev.category || '');
            view.classList.add('hidden');
            editRow.classList.remove('hidden');
            editInput.focus();
          });
          cancelBtn.addEventListener('click', () => {
            editRow.classList.add('hidden');
            view.classList.remove('hidden');
          });
          saveBtn.addEventListener('click', () => {
            saveCalendarEventText(ev.id, editInput.value.trim(), editCategory.value || null);
          });
          delBtn.addEventListener('click', () => deleteCalendarEvent(ev.id));

          item.appendChild(view);
          item.appendChild(editRow);
          popup.appendChild(item);
        });
        cell.appendChild(popup);
      }

      cell.addEventListener('click', () => {
        calDateInput.value = dateStr;
        calTextInput.focus();
        if (dayEvents.length) {
          openCalendarDate = openCalendarDate === dateStr ? null : dateStr;
          renderCalendar();
        }
      });

      calGrid.appendChild(cell);
    }
  }

  calPrevBtn.addEventListener('click', () => {
    calViewDate = new Date(calViewDate.getFullYear(), calViewDate.getMonth() - 1, 1);
    renderCalendar();
  });
  calNextBtn.addEventListener('click', () => {
    calViewDate = new Date(calViewDate.getFullYear(), calViewDate.getMonth() + 1, 1);
    renderCalendar();
  });
  calAddBtn.addEventListener('click', addCalendarEvent);
  calTextInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addCalendarEvent();
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('.calendar-day')) return;
    if (openCalendarDate !== null) {
      openCalendarDate = null;
      renderCalendar();
    }
  });

  // ---- 항상 위 고정 (Document Picture-in-Picture) ----

  if (!('documentPictureInPicture' in window)) {
    pipHint.textContent = '※ 항상 위 고정은 Chrome/Edge 최신 버전에서만 지원됩니다.';
  }

  async function openPip() {
    if (!('documentPictureInPicture' in window)) {
      alert('이 브라우저는 항상 위 고정 기능을 지원하지 않습니다. Chrome 또는 Edge 최신 버전에서 사용해 주세요.');
      return;
    }
    pipWindow = await documentPictureInPicture.requestWindow({ width: 320, height: 420 });

    [...document.styleSheets].forEach((styleSheet) => {
      try {
        const css = [...styleSheet.cssRules].map((r) => r.cssText).join('');
        const style = document.createElement('style');
        style.textContent = css;
        pipWindow.document.head.appendChild(style);
      } catch {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.type = styleSheet.type;
        link.media = styleSheet.media;
        link.href = styleSheet.href;
        pipWindow.document.head.appendChild(link);
      }
    });
    pipWindow.document.body.style.margin = '12px';
    pipWindow.document.body.appendChild(todoSection);
    todoPlaceholder.classList.remove('hidden');

    pipBtn.textContent = '✕ 고정 해제';
    pipBtn.onclick = () => pipWindow.close();

    pipWindow.addEventListener('pagehide', () => {
      todoPlaceholder.classList.add('hidden');
      todoPlaceholder.insertAdjacentElement('beforebegin', todoSection);
      pipBtn.textContent = '📌 항상 위 고정';
      pipBtn.onclick = openPip;
      pipWindow = null;
      renderTodos();
    }, { once: true });
  }

  pipBtn.addEventListener('click', openPip);

  function resetForm() {
    contentInput.value = '';
    startInput.value = toDatetimeLocalValue(new Date());
    rangeToggle.checked = false;
    endLabel.classList.add('hidden');
    endInput.value = '';
    renderCategorySelect('');
    editingId = null;
    saveBtn.textContent = '저장';
    cancelEditBtn.classList.add('hidden');
  }

  rangeToggle.addEventListener('change', () => {
    endLabel.classList.toggle('hidden', !rangeToggle.checked);
    if (rangeToggle.checked && !endInput.value) {
      endInput.value = startInput.value;
    }
  });

  saveBtn.addEventListener('click', () => {
    const content = contentInput.value.trim();
    if (!content) {
      contentInput.focus();
      return;
    }
    if (!startInput.value) {
      startInput.value = toDatetimeLocalValue(new Date());
    }

    const start = new Date(startInput.value).toISOString();
    const end = rangeToggle.checked && endInput.value ? new Date(endInput.value).toISOString() : null;
    const category = categoryInput.value || null;
    const nowIso = new Date().toISOString();

    let entries = loadEntries();

    if (editingId) {
      entries = entries.map((e) =>
        e.id === editingId ? { ...e, content, start, end, category, updatedAt: nowIso } : e
      );
    } else {
      entries.push({
        id: crypto.randomUUID(),
        content,
        start,
        end,
        category,
        createdAt: nowIso,
        updatedAt: nowIso,
      });
    }

    saveEntries(entries);
    resetForm();
    render();
  });

  cancelEditBtn.addEventListener('click', resetForm);

  searchInput.addEventListener('input', render);
  searchCategoryInput.addEventListener('change', render);
  searchDateInput.addEventListener('change', render);
  resetSearchBtn.addEventListener('click', () => {
    searchInput.value = '';
    searchCategoryInput.value = '';
    searchDateInput.value = '';
    render();
  });

  function startEdit(entry) {
    editingId = entry.id;
    contentInput.value = entry.content;
    startInput.value = toDatetimeLocalValue(new Date(entry.start));
    if (entry.end) {
      rangeToggle.checked = true;
      endLabel.classList.remove('hidden');
      endInput.value = toDatetimeLocalValue(new Date(entry.end));
    } else {
      rangeToggle.checked = false;
      endLabel.classList.add('hidden');
      endInput.value = '';
    }
    renderCategorySelect(entry.category || '');
    saveBtn.textContent = '수정 완료';
    cancelEditBtn.classList.remove('hidden');
    contentInput.focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function deleteEntry(id) {
    const entries = loadEntries().filter((e) => e.id !== id);
    saveEntries(entries);
    if (editingId === id) resetForm();
    render();
  }

  function matchesSearch(entry, keyword, dateFilter, categoryFilter) {
    if (keyword) {
      const haystack = `${entry.content} ${entry.category || ''}`.toLowerCase();
      if (!haystack.includes(keyword)) return false;
    }
    if (dateFilter) {
      const startDate = entry.start.slice(0, 10);
      const endDate = entry.end ? entry.end.slice(0, 10) : startDate;
      if (dateFilter < startDate || dateFilter > endDate) return false;
    }
    if (categoryFilter) {
      if (categoryFilter === '__uncategorized__') {
        if (entry.category) return false;
      } else if (entry.category !== categoryFilter) {
        return false;
      }
    }
    return true;
  }

  function render() {
    const keyword = searchInput.value.trim().toLowerCase();
    const dateFilter = searchDateInput.value;
    const categoryFilter = searchCategoryInput.value;
    const isFiltering = !!keyword || !!dateFilter || !!categoryFilter;

    const allEntries = loadEntries();
    const entries = allEntries
      .filter((e) => matchesSearch(e, keyword, dateFilter, categoryFilter))
      .sort((a, b) => new Date(b.start) - new Date(a.start));

    entryCount.textContent = isFiltering
      ? (entries.length ? `검색결과 ${entries.length}건` : '검색결과 없음')
      : (allEntries.length ? `총 ${allEntries.length}건` : '');
    renderSummary();

    if (!entries.length) {
      entryList.innerHTML = `<div class="empty-state">${isFiltering ? '검색 결과가 없습니다.' : '아직 작성된 업무일지가 없습니다.'}</div>`;
      return;
    }

    entryList.innerHTML = entries.map((e) => {
      const stamp = e.end
        ? `${formatKorean(e.start)} ~ ${formatKorean(e.end)}`
        : formatKorean(e.start);
      return `
        <div class="entry-card" data-id="${e.id}">
          <div class="entry-meta">
            <span class="meta-left">
              <span class="stamp">${stamp}</span>
              <span class="category-tag"></span>
            </span>
            <span class="entry-actions">
              <button class="icon-btn edit-btn">수정</button>
              <button class="icon-btn danger delete-btn">삭제</button>
            </span>
          </div>
          <div class="entry-content"></div>
        </div>
      `;
    }).join('');

    entryList.querySelectorAll('.entry-card').forEach((card) => {
      const id = card.getAttribute('data-id');
      const entry = entries.find((e) => e.id === id);
      card.querySelector('.entry-content').textContent = entry.content;
      const entryTag = card.querySelector('.category-tag');
      entryTag.textContent = entry.category || '미분류';
      applyCategoryTagColor(entryTag, entry.category);
      card.querySelector('.edit-btn').addEventListener('click', () => startEdit(entry));
      bindDeleteConfirm(card.querySelector('.delete-btn'), () => deleteEntry(id));
    });
  }

  // ---- 백업 업로드/다운로드 ----

  function showIoStatus(msg) {
    ioStatus.textContent = msg;
    clearTimeout(showIoStatus._timer);
    showIoStatus._timer = setTimeout(() => { ioStatus.textContent = ''; }, 4000);
  }

  exportBtn.addEventListener('click', () => {
    const data = {
      entries: loadEntries(),
      todos: loadTodos(),
      categories: loadCategories(),
      categoryColors: loadCategoryColorMap(),
      dailyTemplates: loadDailyTemplates(),
      dailyCompletions: loadDailyCompletions(),
      calendarEvents: loadCalendarEvents(),
      exportedAt: new Date().toISOString(),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `업무일지_백업_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showIoStatus('백업 다운로드 완료');
  });

  importBtn.addEventListener('click', () => importFile.click());

  importFile.addEventListener('change', () => {
    const file = importFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        let addedEntries = 0;
        let addedTodos = 0;

        if (Array.isArray(data.entries)) {
          const existing = loadEntries();
          const existingIds = new Set(existing.map((e) => e.id));
          const incoming = data.entries.filter((e) => !existingIds.has(e.id));
          saveEntries([...existing, ...incoming]);
          addedEntries = incoming.length;
        }
        if (Array.isArray(data.todos)) {
          const existing = loadTodos();
          const existingIds = new Set(existing.map((t) => t.id));
          const incoming = data.todos.filter((t) => !existingIds.has(t.id));
          saveTodos([...existing, ...incoming]);
          addedTodos = incoming.length;
        }
        if (Array.isArray(data.categories) && data.categories.length) {
          saveCategories(Array.from(new Set([...loadCategories(), ...data.categories])));
        }
        if (data.categoryColors && typeof data.categoryColors === 'object') {
          saveCategoryColorMap({ ...loadCategoryColorMap(), ...data.categoryColors });
        }
        if (Array.isArray(data.dailyTemplates)) {
          const existing = loadDailyTemplates();
          const existingIds = new Set(existing.map((t) => t.id));
          saveDailyTemplates([...existing, ...data.dailyTemplates.filter((t) => !existingIds.has(t.id))]);
        }
        if (Array.isArray(data.dailyCompletions)) {
          const existing = loadDailyCompletions();
          const existingKeys = new Set(existing.map((c) => `${c.templateId}:${c.date}`));
          const incoming = data.dailyCompletions.filter((c) => !existingKeys.has(`${c.templateId}:${c.date}`));
          saveDailyCompletions([...existing, ...incoming]);
        }
        if (Array.isArray(data.calendarEvents)) {
          const existing = loadCalendarEvents();
          const existingIds = new Set(existing.map((e) => e.id));
          saveCalendarEvents([...existing, ...data.calendarEvents.filter((e) => !existingIds.has(e.id))]);
        }

        renderCategorySelect();
        refreshTodoCategoryInput();
        refreshSearchCategoryInput();
        refreshDailyCategoryInput();
        refreshCalCategoryInput();
        render();
        renderTodos();
        renderDaily();
        renderCalendar();
        showIoStatus(`백업 업로드 완료 (업무일지 ${addedEntries}건, TODO ${addedTodos}건 추가)`);
      } catch {
        showIoStatus('백업 업로드 실패: JSON 파일 형식을 확인해주세요.');
      }
      importFile.value = '';
    };
    reader.readAsText(file);
  });

  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      render();
      renderTodos();
      renderDaily();
    });
  }

  migrateCompletedTodos();
  resetForm();
  refreshTodoCategoryInput();
  refreshSearchCategoryInput();
  refreshDailyCategoryInput();
  refreshCalCategoryInput();
  calDateInput.value = getTodayStr();
  render();
  renderTodos();
  renderDaily();
  renderCalendar();
})();
</script>
</body>
</html>

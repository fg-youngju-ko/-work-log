<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODO 마인드맵 - 업무일지</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1f2328;
    --text-muted: #6b7280;
    --accent: #6c5ce0;
    --accent-dark: #5b3fd6;
    --accent-text: #ffffff;
    --accent-wash: #efecfd;
    --danger: #ef4444;
    --border: #e5e7eb;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --card-bg: #1f2126;
      --text: #e8e9ec;
      --text-muted: #9a9ea5;
      --accent: #6c5ce0;
      --accent-dark: #b8a6ff;
      --accent-text: #ffffff;
      --accent-wash: #2a2545;
      --danger: #f87171;
      --border: #2e3036;
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181c; --card-bg: #1f2126; --text: #e8e9ec; --text-muted: #9a9ea5;
    --accent: #6c5ce0; --accent-dark: #b8a6ff; --accent-text: #ffffff; --accent-wash: #2a2545;
    --danger: #f87171; --border: #2e3036; --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7; --card-bg: #ffffff; --text: #1f2328; --text-muted: #6b7280;
    --accent: #6c5ce0; --accent-dark: #5b3fd6; --accent-text: #ffffff; --accent-wash: #efecfd;
    --danger: #ef4444; --border: #e5e7eb; --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; }
  .hidden { display: none !important; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  header h1 { font-size: 20px; margin: 0; }
  .back-link {
    background: var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 13px;
  }
  .back-link:hover { opacity: 0.85; }
  .add-branch-row { display: flex; gap: 8px; margin-bottom: 28px; }
  .add-branch-row input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    font-family: inherit;
    font-size: 14px;
    background: var(--card-bg);
    color: var(--text);
  }
  .add-branch-row select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 8px;
    font-family: inherit;
    font-size: 13px;
    background: var(--card-bg);
    color: var(--text);
  }
  .add-branch-row button {
    background: var(--accent);
    color: var(--accent-text);
    padding: 9px 18px;
    border: none;
    border-radius: 9px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .add-branch-row button:hover { opacity: 0.9; }
  .mindmap-canvas { position: relative; }
  .connector-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .connector-line { stroke: var(--border); stroke-width: 2; }
  .hub {
    position: relative;
    z-index: 2;
    width: 180px;
    margin: 0 auto 56px;
    padding: 22px 16px;
    text-align: center;
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    box-shadow: var(--shadow);
  }
  .branch-row {
    position: relative;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
  }
  .branch {
    width: 230px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .branch-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 10px 12px;
    font-weight: 700;
    font-size: 13.5px;
    background: var(--border);
    color: var(--text);
  }
  .branch-title { word-break: break-word; }
  .branch-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .branch-actions button {
    background: transparent;
    border: none;
    padding: 2px 5px;
    font-size: 12px;
    cursor: pointer;
    color: inherit;
    opacity: 0.8;
  }
  .branch-actions button:hover { opacity: 1; }
  .branch-actions button.confirming { background: rgba(0,0,0,0.15); border-radius: 4px; }
  .branch-rename-input {
    font: inherit;
    font-weight: 700;
    font-size: 13.5px;
    border: none;
    border-bottom: 1px solid currentColor;
    background: transparent;
    color: inherit;
    width: 120px;
  }
  .branch-leaves {
    min-height: 56px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: background 0.15s;
  }
  .branch-leaves.drag-over { background: var(--accent-wash); }
  .leaf {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    font-size: 13px;
    cursor: grab;
  }
  .leaf.dragging { opacity: 0.35; }
  .leaf-main { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
  .leaf-check-group { display: flex; align-items: flex-start; gap: 6px; flex: 1; min-width: 0; }
  .leaf-check { margin-top: 2px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
  .leaf-text { word-break: break-word; }
  .leaf-text.has-memo { cursor: help; text-decoration: underline dotted; text-underline-offset: 2px; }
  #floatingMemoPopup {
    display: none;
    position: fixed;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 8px 10px;
    max-width: 280px;
    white-space: pre-wrap;
    font-size: 12px;
    color: var(--text);
    z-index: 1000;
    pointer-events: none;
  }
  .leaf-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .leaf-edit-btn,
  .leaf-del-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    padding: 0 4px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .leaf-edit-form { margin-top: 6px; }
  .leaf-edit-form input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 7px;
    font-family: inherit;
    font-size: 12.5px;
    background: transparent;
    color: var(--text);
    margin-bottom: 5px;
  }
  .leaf-edit-form textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 44px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 7px;
    font-family: inherit;
    font-size: 12px;
    background: transparent;
    color: var(--text);
    resize: vertical;
    margin-bottom: 5px;
  }
  .leaf-edit-actions { display: flex; justify-content: flex-end; gap: 5px; }
  .leaf-edit-actions button {
    padding: 3px 9px;
    font-size: 11px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .leaf-edit-save-btn { background: var(--accent); color: var(--accent-text); }
  .leaf-edit-cancel-btn { background: var(--border); color: var(--text); }
  .category-tag {
    align-self: flex-start;
    background: var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 10.5px;
    font-weight: 600;
    border: 1px solid transparent;
  }
  .leaf-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .source-badge {
    align-self: flex-start;
    font-size: 10px;
    font-weight: 600;
    color: var(--accent-dark);
    background: var(--accent-wash);
    border-radius: 999px;
    padding: 1px 7px;
  }
  .branch-empty {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 6px 0;
  }
  .hint {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🧠 TODO 마인드맵</h1>
    <a class="back-link" href="index.html">← 업무일지로</a>
  </header>

  <div class="add-branch-row">
    <input type="text" id="newTodoInput" placeholder="새 할 일 추가">
    <select id="newTodoCategoryInput"></select>
    <button type="button" id="addTodoBtn">추가</button>
  </div>

  <div class="add-branch-row">
    <input type="text" id="newBranchInput" placeholder="새 업무대제목 이름 (예: 신제품 A 출시)">
    <button type="button" id="addBranchBtn">추가</button>
  </div>

  <div class="mindmap-canvas" id="mindmapCanvas">
    <svg class="connector-layer" id="connectorLayer"></svg>
    <div class="hub" id="hubNode">📋 전체 TODO</div>
    <div class="branch-row" id="branchRow"></div>
  </div>

  <p class="hint">
    일반 TODO뿐 아니라 오늘 활성화된 Daily 업무("매일"/"매주 X" 배지)와 오늘 날짜의 달력 일정("📅 오늘" 배지)도
    함께 표시됩니다. 할 일을 드래그해서 다른 업무대제목으로 옮길 수 있습니다. 업무대제목은 기존 카테고리와
    별개의 분류이며, 카테고리는 항목 아래에 참고용 태그로만 표시됩니다(여기서는 수정 불가).
    대제목의 ✎(수정)/×(삭제)는 헤더 우측에 있습니다.
  </p>
</div>
<div id="floatingMemoPopup"></div>

<script>
(function () {
  const TODO_STORAGE_KEY = 'workLog.todos';
  const ENTRY_STORAGE_KEY = 'workLog.entries';
  const DAILY_STORAGE_KEY = 'workLog.dailyTemplates';
  const DAILY_COMPLETIONS_KEY = 'workLog.dailyCompletions';
  const CALENDAR_STORAGE_KEY = 'workLog.calendarEvents';
  const PROJECT_STORAGE_KEY = 'workLog.projects';
  const PROJECT_COLOR_MAP_KEY = 'workLog.projectColors';
  const CATEGORY_STORAGE_KEY = 'workLog.categories';
  const CATEGORY_COLOR_MAP_KEY = 'workLog.categoryColors';
  const UNASSIGNED_KEY = '__unassigned__';
  const WEEKDAY_LABELS = ['일', '월', '화', '수', '목', '금', '토'];

  const COLOR_SLOTS = [
    { light: '#2573c1', dark: '#699ed3' },
    { light: '#2530c1', dark: '#6970d3' },
    { light: '#5c25c1', dark: '#8f69d3' },
    { light: '#9f25c1', dark: '#bd69d3' },
    { light: '#c1259f', dark: '#d369bd' },
    { light: '#c1255c', dark: '#d3698f' },
    { light: '#c13025', dark: '#d37069' },
    { light: '#c17325', dark: '#d39e69' },
    { light: '#c1b625', dark: '#d3cc69' },
    { light: '#89c125', dark: '#add369' },
    { light: '#46c125', dark: '#80d369' },
    { light: '#25c146', dark: '#69d380' },
    { light: '#25c189', dark: '#69d3ad' },
    { light: '#25b6c1', dark: '#69ccd3' },
  ];

  const newTodoInput = document.getElementById('newTodoInput');
  const newTodoCategoryInput = document.getElementById('newTodoCategoryInput');
  const addTodoBtn = document.getElementById('addTodoBtn');
  const newBranchInput = document.getElementById('newBranchInput');
  const addBranchBtn = document.getElementById('addBranchBtn');
  const mindmapCanvas = document.getElementById('mindmapCanvas');
  const connectorLayer = document.getElementById('connectorLayer');
  const hubNode = document.getElementById('hubNode');
  const branchRow = document.getElementById('branchRow');
  const floatingMemoPopup = document.getElementById('floatingMemoPopup');

  // 타일(.branch)이 overflow:hidden이라 자식으로 팝업을 두면 경계에서 잘리므로,
  // body 바로 아래에 떠 있는 단일 팝업을 뷰포트 기준 좌표로 옮겨가며 재사용한다.
  function showMemoPopup(triggerEl, memoText) {
    floatingMemoPopup.textContent = memoText;
    floatingMemoPopup.style.display = 'block';
    const rect = triggerEl.getBoundingClientRect();
    const popupRect = floatingMemoPopup.getBoundingClientRect();
    let top = rect.top - popupRect.height - 8;
    if (top < 8) top = rect.bottom + 8;
    let left = rect.left;
    const maxLeft = window.innerWidth - popupRect.width - 8;
    if (left > maxLeft) left = Math.max(8, maxLeft);
    floatingMemoPopup.style.top = `${top}px`;
    floatingMemoPopup.style.left = `${left}px`;
  }
  function hideMemoPopup() {
    floatingMemoPopup.style.display = 'none';
  }

  function loadEntries() {
    try { return JSON.parse(localStorage.getItem(ENTRY_STORAGE_KEY)) || []; } catch { return []; }
  }
  function saveEntries(entries) {
    localStorage.setItem(ENTRY_STORAGE_KEY, JSON.stringify(entries));
  }
  function loadTodos() {
    try { return JSON.parse(localStorage.getItem(TODO_STORAGE_KEY)) || []; } catch { return []; }
  }
  function saveTodos(todos) {
    localStorage.setItem(TODO_STORAGE_KEY, JSON.stringify(todos));
  }
  function loadDailyTemplates() {
    try { return JSON.parse(localStorage.getItem(DAILY_STORAGE_KEY)) || []; } catch { return []; }
  }
  function saveDailyTemplates(templates) {
    localStorage.setItem(DAILY_STORAGE_KEY, JSON.stringify(templates));
  }
  function loadDailyCompletions() {
    try { return JSON.parse(localStorage.getItem(DAILY_COMPLETIONS_KEY)) || []; } catch { return []; }
  }
  function saveDailyCompletions(completions) {
    localStorage.setItem(DAILY_COMPLETIONS_KEY, JSON.stringify(completions));
  }
  function loadCalendarEvents() {
    try { return JSON.parse(localStorage.getItem(CALENDAR_STORAGE_KEY)) || []; } catch { return []; }
  }
  function saveCalendarEvents(events) {
    localStorage.setItem(CALENDAR_STORAGE_KEY, JSON.stringify(events));
  }

  function getTodayStr() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  // index.html의 TODO/Daily/달력을 전부 모아 하나의 마인드맵으로 보여준다.
  // 각 항목은 __source로 원래 저장소를 기억해서, 프로젝트 재배치·삭제 시
  // 올바른 저장소에 반영되도록 한다.
  function getRegularTodoItems() {
    return loadTodos().map((t) => ({ ...t, __source: 'todo', __key: `todo:${t.id}` }));
  }
  function toMondayIndex(day) {
    return (day + 6) % 7;
  }
  function getWeekRangeStrings(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    const day = d.getDay();
    const diffToMonday = day === 0 ? -6 : 1 - day;
    const start = new Date(d);
    start.setDate(d.getDate() + diffToMonday);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (dt) => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
    return { startStr: fmt(start), endStr: fmt(end) };
  }

  // 매주 항목은 "정확히 그 요일"에만 보이던 걸 "그 요일이 되면 그 주가 끝날
  // 때까지 체크 전엔 계속 보이도록" 수정(index.html의 renderDaily()와 동일한 수정).
  function getActiveDailyItems() {
    const todayStr = getTodayStr();
    const todayWeekday = new Date().getDay();
    const { startStr: weekStartStr, endStr: weekEndStr } = getWeekRangeStrings(new Date());
    const completions = loadDailyCompletions();
    const completedTodayIds = new Set(completions.filter((c) => c.date === todayStr).map((c) => c.templateId));
    const completedThisWeekIds = new Set(
      completions.filter((c) => c.date >= weekStartStr && c.date <= weekEndStr).map((c) => c.templateId)
    );
    const todayMondayIdx = toMondayIndex(todayWeekday);

    return loadDailyTemplates()
      .filter((t) => {
        if (t.frequency === 'daily') return !completedTodayIds.has(t.id);
        const reached = todayMondayIdx >= toMondayIndex(t.weekday);
        return reached && !completedThisWeekIds.has(t.id);
      })
      .map((t) => ({
        ...t,
        __source: 'daily',
        __key: `daily:${t.id}`,
        __badge: t.frequency === 'weekly' ? `매주 ${WEEKDAY_LABELS[t.weekday]}` : '매일',
      }));
  }
  function getTodayCalendarItems() {
    const todayStr = getTodayStr();
    return loadCalendarEvents()
      .filter((e) => e.date === todayStr)
      .map((e) => ({ ...e, __source: 'calendar', __key: `cal:${e.id}`, __badge: '📅 오늘' }));
  }

  function updateItemProject(item, project) {
    if (item.__source === 'daily') {
      saveDailyTemplates(loadDailyTemplates().map((t) => (t.id === item.id ? { ...t, project } : t)));
    } else if (item.__source === 'calendar') {
      saveCalendarEvents(loadCalendarEvents().map((e) => (e.id === item.id ? { ...e, project } : e)));
    } else {
      saveTodos(loadTodos().map((t) => (t.id === item.id ? { ...t, project } : t)));
    }
    render();
  }

  function updateItemContent(item, text, memo) {
    if (item.__source === 'daily') {
      saveDailyTemplates(loadDailyTemplates().map((t) => (t.id === item.id ? { ...t, text, memo } : t)));
    } else if (item.__source === 'calendar') {
      saveCalendarEvents(loadCalendarEvents().map((e) => (e.id === item.id ? { ...e, text, memo } : e)));
    } else {
      saveTodos(loadTodos().map((t) => (t.id === item.id ? { ...t, text, memo } : t)));
    }
    render();
  }

  function deleteItem(item) {
    if (item.__source === 'daily') {
      saveDailyTemplates(loadDailyTemplates().filter((t) => t.id !== item.id));
      saveDailyCompletions(loadDailyCompletions().filter((c) => c.templateId !== item.id));
    } else if (item.__source === 'calendar') {
      saveCalendarEvents(loadCalendarEvents().filter((e) => e.id !== item.id));
    } else {
      saveTodos(loadTodos().filter((t) => t.id !== item.id));
    }
    render();
  }

  // 체크 완료 시 index.html의 completeTodo/completeDailyToday/completeCalendarEvent와
  // 동일하게 업무일지 항목을 생성한다. daily는 source:'daily' 태그를 남겨야
  // index.html의 "메모 없는 daily는 주간요약 제외" 필터가 그대로 적용된다.
  function completeItem(item) {
    const nowIso = new Date().toISOString();
    const entries = loadEntries();
    const entry = {
      id: crypto.randomUUID(),
      content: item.memo ? `${item.text}\n\n${item.memo}` : item.text,
      start: nowIso,
      end: null,
      category: item.category || null,
      createdAt: nowIso,
      updatedAt: nowIso,
    };
    if (item.__source === 'daily') entry.source = 'daily';
    entries.push(entry);
    saveEntries(entries);

    if (item.__source === 'daily') {
      const completions = loadDailyCompletions();
      completions.push({ templateId: item.id, date: getTodayStr() });
      saveDailyCompletions(completions);
    } else if (item.__source === 'calendar') {
      saveCalendarEvents(loadCalendarEvents().filter((e) => e.id !== item.id));
    } else {
      saveTodos(loadTodos().filter((t) => t.id !== item.id));
    }
    render();
  }

  function addTodo() {
    const text = newTodoInput.value.trim();
    if (!text) {
      newTodoInput.focus();
      return;
    }
    const todos = loadTodos();
    todos.push({
      id: crypto.randomUUID(),
      text,
      memo: '',
      category: newTodoCategoryInput.value || null,
      project: null,
      createdAt: new Date().toISOString(),
    });
    saveTodos(todos);
    newTodoInput.value = '';
    newTodoCategoryInput.value = '';
    newTodoInput.focus();
    render();
  }
  function loadProjects() {
    try { return JSON.parse(localStorage.getItem(PROJECT_STORAGE_KEY)) || []; } catch { return []; }
  }
  function saveProjects(projects) {
    localStorage.setItem(PROJECT_STORAGE_KEY, JSON.stringify(projects));
  }
  function loadProjectColorMap() {
    try { return JSON.parse(localStorage.getItem(PROJECT_COLOR_MAP_KEY)) || {}; } catch { return {}; }
  }
  function saveProjectColorMap(map) {
    localStorage.setItem(PROJECT_COLOR_MAP_KEY, JSON.stringify(map));
  }
  function loadCategoryColorMap() {
    try { return JSON.parse(localStorage.getItem(CATEGORY_COLOR_MAP_KEY)) || {}; } catch { return {}; }
  }
  // 카테고리 자체의 추가/수정/삭제는 index.html에서만 관리 - 여기서는 새 할 일
  // 작성 시 고를 수 있도록 목록만 읽어온다(없으면 빈 배열, 기본값을 만들어 쓰지 않음).
  function loadCategories() {
    try {
      const stored = JSON.parse(localStorage.getItem(CATEGORY_STORAGE_KEY));
      if (Array.isArray(stored)) return stored;
    } catch {}
    return [];
  }
  function populateNewTodoCategorySelect() {
    const categories = loadCategories();
    newTodoCategoryInput.innerHTML = '';
    const noneOpt = document.createElement('option');
    noneOpt.value = '';
    noneOpt.textContent = '미분류';
    newTodoCategoryInput.appendChild(noneOpt);
    categories.forEach((c) => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      newTodoCategoryInput.appendChild(opt);
    });
  }

  function hashName(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    return hash % COLOR_SLOTS.length;
  }
  function isDarkMode() {
    const theme = document.documentElement.getAttribute('data-theme');
    if (theme === 'dark') return true;
    if (theme === 'light') return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function pickTextColor(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    const lin = (c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
    const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    return L > 0.45 ? '#1f2328' : '#ffffff';
  }
  // 업무대제목(프로젝트)과 기존 카테고리는 서로 다른 이름공간이라 각자의
  // override 맵을 받아 같은 팔레트에서 독립적으로 색을 고른다.
  function getColorFor(name, overrideMap) {
    if (!name) return null;
    const idx = Number.isInteger(overrideMap[name]) && COLOR_SLOTS[overrideMap[name]] ? overrideMap[name] : hashName(name);
    const slot = COLOR_SLOTS[idx];
    const bg = isDarkMode() ? slot.dark : slot.light;
    return { bg, text: pickTextColor(bg) };
  }
  function getProjectColor(name) {
    return getColorFor(name, loadProjectColorMap());
  }
  function getCategoryTagColor(name) {
    return getColorFor(name, loadCategoryColorMap());
  }

  // 삭제 버튼: 한 번 더 누르면 실제 삭제(네이티브 confirm은 미리보기 환경에서
  // 차단될 수 있어 쓰지 않음 - work-log 프로젝트의 기존 패턴 재사용)
  function bindDeleteConfirm(btn, onConfirm) {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (btn.dataset.confirming === '1') {
        onConfirm();
        return;
      }
      btn.dataset.confirming = '1';
      const original = btn.textContent;
      btn.textContent = '?';
      btn.title = '한 번 더 클릭하면 삭제';
      btn.classList.add('confirming');
      setTimeout(() => {
        btn.dataset.confirming = '0';
        btn.textContent = original;
        btn.title = '';
        btn.classList.remove('confirming');
      }, 2500);
    });
  }

  function addProject() {
    const name = newBranchInput.value.trim();
    if (!name) {
      newBranchInput.focus();
      return;
    }
    const projects = loadProjects();
    if (!projects.includes(name)) {
      projects.push(name);
      saveProjects(projects);
    }
    newBranchInput.value = '';
    render();
  }

  function renameProject(oldName, newName) {
    if (!newName || oldName === newName) {
      render();
      return;
    }
    const projects = loadProjects();
    if (projects.includes(newName)) {
      render();
      return;
    }
    saveProjects(projects.map((p) => (p === oldName ? newName : p)));

    const colorMap = loadProjectColorMap();
    if (Object.prototype.hasOwnProperty.call(colorMap, oldName)) {
      colorMap[newName] = colorMap[oldName];
      delete colorMap[oldName];
      saveProjectColorMap(colorMap);
    }

    saveTodos(loadTodos().map((t) => (t.project === oldName ? { ...t, project: newName } : t)));
    render();
  }

  function deleteProject(name) {
    saveProjects(loadProjects().filter((p) => p !== name));
    const colorMap = loadProjectColorMap();
    if (Object.prototype.hasOwnProperty.call(colorMap, name)) {
      delete colorMap[name];
      saveProjectColorMap(colorMap);
    }
    render();
  }


  function startRenameProject(titleSpan, name) {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'branch-rename-input';
    input.value = name;
    titleSpan.replaceWith(input);
    input.focus();
    input.select();

    let done = false;
    function commit() {
      if (done) return;
      done = true;
      renameProject(name, input.value.trim());
    }
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') {
        done = true;
        render();
      }
    });
    input.addEventListener('blur', commit);
  }

  function drawConnectors() {
    const canvasRect = mindmapCanvas.getBoundingClientRect();
    connectorLayer.setAttribute('width', String(canvasRect.width));
    connectorLayer.setAttribute('height', String(canvasRect.height));
    connectorLayer.innerHTML = '';

    const hubRect = hubNode.getBoundingClientRect();
    const hubX = hubRect.left + hubRect.width / 2 - canvasRect.left;
    const hubY = hubRect.top + hubRect.height / 2 - canvasRect.top;

    branchRow.querySelectorAll('.branch').forEach((branchEl) => {
      const r = branchEl.getBoundingClientRect();
      const bx = r.left + r.width / 2 - canvasRect.left;
      const by = r.top - canvasRect.top;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('class', 'connector-line');
      line.setAttribute('x1', String(hubX));
      line.setAttribute('y1', String(hubY));
      line.setAttribute('x2', String(bx));
      line.setAttribute('y2', String(by));
      connectorLayer.appendChild(line);
    });
  }

  // 마인드맵의 가지(대제목) = 업무대제목(workLog.projects), 기존 카테고리와는 별개.
  // 각 항목(leaf)은 자신이 속한 대제목 아래에 나타나되, 원래 카테고리는 참고용
  // 태그로만 함께 표시한다(여기서는 카테고리 자체를 수정하지 않음).
  function render() {
    const projects = loadProjects();
    const allItems = [...getRegularTodoItems(), ...getActiveDailyItems(), ...getTodayCalendarItems()];

    const grouped = {};
    projects.forEach((p) => { grouped[p] = []; });
    grouped[UNASSIGNED_KEY] = [];
    allItems.forEach((item) => {
      const key = item.project && Object.prototype.hasOwnProperty.call(grouped, item.project) ? item.project : UNASSIGNED_KEY;
      grouped[key].push(item);
    });

    const branchNames = [...projects, UNASSIGNED_KEY];
    branchRow.innerHTML = '';

    branchNames.forEach((name) => {
      const isUnassigned = name === UNASSIGNED_KEY;
      const label = isUnassigned ? '자동 생성' : name;
      const color = isUnassigned ? null : getProjectColor(name);

      const branchEl = document.createElement('div');
      branchEl.className = 'branch';

      const headerEl = document.createElement('div');
      headerEl.className = 'branch-header';
      if (color) {
        headerEl.style.background = color.bg;
        headerEl.style.color = color.text;
      }

      const titleSpan = document.createElement('span');
      titleSpan.className = 'branch-title';
      titleSpan.textContent = label;
      headerEl.appendChild(titleSpan);

      if (!isUnassigned) {
        const actions = document.createElement('span');
        actions.className = 'branch-actions';
        const renameBtn = document.createElement('button');
        renameBtn.type = 'button';
        renameBtn.textContent = '✎';
        renameBtn.addEventListener('click', () => startRenameProject(titleSpan, name));
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.textContent = '×';
        bindDeleteConfirm(delBtn, () => deleteProject(name));
        actions.appendChild(renameBtn);
        actions.appendChild(delBtn);
        headerEl.appendChild(actions);
      }
      branchEl.appendChild(headerEl);

      const leavesEl = document.createElement('div');
      leavesEl.className = 'branch-leaves';

      const items = grouped[name] || [];
      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'branch-empty';
        empty.textContent = '항목 없음';
        leavesEl.appendChild(empty);
      }
      items.forEach((item) => {
        const leaf = document.createElement('div');
        leaf.className = 'leaf';
        leaf.draggable = true;

        const mainRow = document.createElement('div');
        mainRow.className = 'leaf-main';

        const checkGroup = document.createElement('div');
        checkGroup.className = 'leaf-check-group';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'leaf-check';
        checkbox.addEventListener('change', (e) => {
          if (e.target.checked) completeItem(item);
        });
        const textEl = document.createElement('span');
        textEl.className = 'leaf-text';
        textEl.textContent = item.text;
        if (item.memo) {
          textEl.classList.add('has-memo');
          textEl.addEventListener('mouseenter', () => showMemoPopup(textEl, item.memo));
          textEl.addEventListener('mouseleave', hideMemoPopup);
        }
        checkGroup.appendChild(checkbox);
        checkGroup.appendChild(textEl);

        const actionsGroup = document.createElement('div');
        actionsGroup.className = 'leaf-actions';
        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'leaf-edit-btn';
        editBtn.textContent = '✎';
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'leaf-del-btn';
        delBtn.textContent = '×';
        bindDeleteConfirm(delBtn, () => deleteItem(item));
        actionsGroup.appendChild(editBtn);
        actionsGroup.appendChild(delBtn);

        mainRow.appendChild(checkGroup);
        mainRow.appendChild(actionsGroup);
        leaf.appendChild(mainRow);

        const tagsRow = document.createElement('div');
        tagsRow.className = 'leaf-tags';

        if (item.__badge) {
          const badgeEl = document.createElement('span');
          badgeEl.className = 'source-badge';
          badgeEl.textContent = item.__badge;
          tagsRow.appendChild(badgeEl);
        }

        const tagEl = document.createElement('span');
        tagEl.className = 'category-tag';
        tagEl.textContent = item.category || '미분류';
        const catColor = getCategoryTagColor(item.category);
        if (catColor) {
          tagEl.style.background = catColor.bg;
          tagEl.style.color = catColor.text;
          tagEl.style.borderColor = catColor.bg;
        }
        tagsRow.appendChild(tagEl);
        leaf.appendChild(tagsRow);

        // 인라인 수정 폼: 본문/메모를 여기서 바로 고쳐 저장(카테고리는 참고 태그로만
        // 유지 - 카테고리 자체 관리는 index.html 전담이라는 기존 방침 유지).
        const editForm = document.createElement('div');
        editForm.className = 'leaf-edit-form hidden';
        const editTextInput = document.createElement('input');
        editTextInput.type = 'text';
        const editMemoTextarea = document.createElement('textarea');
        editMemoTextarea.placeholder = '상세 메모';
        const editActions = document.createElement('div');
        editActions.className = 'leaf-edit-actions';
        const editCancelBtn = document.createElement('button');
        editCancelBtn.type = 'button';
        editCancelBtn.className = 'leaf-edit-cancel-btn';
        editCancelBtn.textContent = '취소';
        const editSaveBtn = document.createElement('button');
        editSaveBtn.type = 'button';
        editSaveBtn.className = 'leaf-edit-save-btn';
        editSaveBtn.textContent = '저장';
        editActions.appendChild(editCancelBtn);
        editActions.appendChild(editSaveBtn);
        editForm.appendChild(editTextInput);
        editForm.appendChild(editMemoTextarea);
        editForm.appendChild(editActions);
        leaf.appendChild(editForm);

        editBtn.addEventListener('click', () => {
          editTextInput.value = item.text;
          editMemoTextarea.value = item.memo || '';
          editForm.classList.toggle('hidden');
          if (!editForm.classList.contains('hidden')) editTextInput.focus();
        });
        editCancelBtn.addEventListener('click', () => editForm.classList.add('hidden'));
        editSaveBtn.addEventListener('click', () => {
          const newText = editTextInput.value.trim();
          if (!newText) {
            editTextInput.focus();
            return;
          }
          updateItemContent(item, newText, editMemoTextarea.value.trim());
        });

        leaf.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', item.__key);
          leaf.classList.add('dragging');
        });
        leaf.addEventListener('dragend', () => leaf.classList.remove('dragging'));

        leavesEl.appendChild(leaf);
      });

      leavesEl.addEventListener('dragover', (e) => {
        e.preventDefault();
        leavesEl.classList.add('drag-over');
      });
      leavesEl.addEventListener('dragleave', () => leavesEl.classList.remove('drag-over'));
      leavesEl.addEventListener('drop', (e) => {
        e.preventDefault();
        leavesEl.classList.remove('drag-over');
        const key = e.dataTransfer.getData('text/plain');
        const item = allItems.find((it) => it.__key === key);
        if (item) updateItemProject(item, isUnassigned ? null : name);
      });

      branchEl.appendChild(leavesEl);
      branchRow.appendChild(branchEl);
    });

    drawConnectors();
  }

  addTodoBtn.addEventListener('click', addTodo);
  newTodoInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTodo();
  });
  addBranchBtn.addEventListener('click', addProject);
  newBranchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addProject();
  });
  window.addEventListener('resize', drawConnectors);
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
  }

  populateNewTodoCategorySelect();
  render();
})();
</script>
</body>
</html>
